<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeletron OS</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            font-family: 'Segoe UI', 'Arial', sans-serif; color: #ccd6f6;
        }
        #app { position: relative; width: 100%; height: 100%; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; justify-content: space-between; align-items: center; padding: 2rem; box-sizing: border-box; }
        .right-panel { width: 300px; max-height: 70%; overflow-y: auto; pointer-events: auto; background: rgba(2,12,27,0.4); backdrop-filter: blur(8px); border: 1px solid #64ffda; border-radius: 16px; padding: 16px; }
        .message { padding: 10px 14px; border-radius: 18px; max-width: 80%; word-wrap: break-word; animation: fadeIn 0.3s; font-size: 14px; }
        .user-message { align-self: flex-end; background: #112240; color: #64ffda; }
        .ai-message { align-self: flex-start; background: #0a192f; color: #ccd6f6; border: 1px solid #64ffda; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .status-text { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); color: #8892b0; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; z-index: 3; text-shadow: 0 0 10px #1e90ff; }
        #mic-btn { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 50%; background: rgba(10,25,47,0.6); border: 2px solid #64ffda; backdrop-filter: blur(5px); cursor: pointer; z-index: 4; transition: 0.3s; box-shadow: 0 0 20px rgba(100,255,218,0.3); display: flex; align-items: center; justify-content: center; }
        #mic-btn:hover { background: rgba(100,255,218,0.2); box-shadow: 0 0 30px #64ffda; transform: translateX(-50%) scale(1.05); }
        #mic-btn svg { width: 36px; height: 36px; fill: #64ffda; }
        #mic-btn.disabled { opacity: 0.5; pointer-events: none; border-color: #8892b0; }
        #title { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); color: #64ffda; font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.8; z-index: 3; }
    </style>
    <script type="importmap">
        {"imports": {"three": "https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"}}
    </script>
</head>
<body>
<div id="app">
    <div id="canvas-container"></div>
    <div id="ui-overlay"><div class="left-panel"></div><div class="center-area"></div><div class="right-panel" id="chat-panel"></div></div>
    <div id="title">SKELETRON OS</div>
    <div id="status-text" class="status-text">⚡ READY</div>
    <div id="mic-btn" onclick="toggleListening()"><svg viewBox="0 0 24 24"><path d="M12 16c-2.206 0-4-1.794-4-4V6c0-2.206 1.794-4 4-4s4 1.794 4 4v6c0 2.206-1.794 4-4 4z"/><path d="M19 12v-2c0-3.866-3.134-7-7-7s-7 3.134-7 7v2c0 1.103.897 2 2 2s2-.897 2-2v-2c0-1.654 1.346-3 3-3s3 1.346 3 3v2c0 1.103.897 2 2 2s2-.897 2-2z"/></svg></div>
</div>
<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = null;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,0,8);
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    container.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold=0.1; bloomPass.strength=1.2; bloomPass.radius=0.5;
    composer.addPass(bloomPass);
    scene.add(new THREE.AmbientLight(0x404060));
    const l1 = new THREE.PointLight(0x64ffda,1,20); l1.position.set(2,3,4); scene.add(l1);
    const l2 = new THREE.PointLight(0x1e90ff,0.8,20); l2.position.set(-3,-1,5); scene.add(l2);
    const orbGroup = new THREE.Group(); scene.add(orbGroup);
    const core = new THREE.Mesh(new THREE.SphereGeometry(1.2,64,32), new THREE.MeshStandardMaterial({color:0x1e90ff, emissive:0x0a4c8a, roughness:0.2, metalness:0.1, transparent:true, opacity:0.95}));
    orbGroup.add(core);
    const shell = new THREE.Mesh(new THREE.SphereGeometry(1.45,64,32), new THREE.MeshPhongMaterial({color:0x64ffda, transparent:true, opacity:0.15, side:THREE.DoubleSide}));
    orbGroup.add(shell);
    const reactiveRing = new THREE.Mesh(new THREE.TorusGeometry(1.8,0.03,32,100), new THREE.MeshStandardMaterial({color:0x64ffda, emissive:0x1e90ff, transparent:true, opacity:0.8}));
    reactiveRing.rotation.x=Math.PI/2; orbGroup.add(reactiveRing);
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(2.1,0.015,16,100), new THREE.MeshStandardMaterial({color:0x1e90ff, emissive:0x0a4c8a, transparent:true, opacity:0.5}));
    outerRing.rotation.z=0.3; outerRing.rotation.x=0.8; orbGroup.add(outerRing);
    const pGeo = new THREE.BufferGeometry(); const pCount=2000; const pos=new Float32Array(pCount*3);
    for(let i=0;i<pCount*3;i+=3){const r=2.5+Math.random()*4,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1); pos[i]=Math.sin(ph)*Math.cos(th)*r; pos[i+1]=Math.sin(ph)*Math.sin(th)*r; pos[i+2]=Math.cos(ph)*r;}
    pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3)); const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.015,color:0x64ffda,blending:THREE.AdditiveBlending})); scene.add(particles);

    const State={IDLE:'IDLE',LISTENING:'LISTENING',PROCESSING:'PROCESSING',SPEAKING:'SPEAKING'};
    let current=State.IDLE, ws=null;
    const statusDiv=document.getElementById('status-text'), micBtn=document.getElementById('mic-btn'), chat=document.getElementById('chat-panel');
    function setState(s){current=s; statusDiv.textContent={IDLE:'⚡ READY',LISTENING:'🎤 LISTENING...',PROCESSING:'⏳ PROCESSING...',SPEAKING:'🔊 SPEAKING...'}[s]; micBtn.classList.toggle('disabled',s!==State.IDLE);}
    function addMessage(txt,sender){const d=document.createElement('div'); d.className=`message ${sender==='user'?'user-message':'ai-message'}`; d.textContent=txt; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;}
    window.toggleListening=()=>{if(current!==State.IDLE)return; setState(State.LISTENING); ws=new WebSocket('ws://127.0.0.1:8000/ws'); ws.onopen=()=>ws.send('start_listening'); ws.onmessage=e=>{const m=e.data; if(m==='listening_started'){} else if(m.startsWith('transcribed:'))addMessage(m.substring(12),'user'); else if(m.startsWith('response:')){addMessage(m.substring(9),'ai'); setState(State.SPEAKING);} else if(m==='done'){setState(State.IDLE); ws.close();} else if(m.startsWith('error:')){addMessage('Error: '+m.substring(6),'ai'); setState(State.IDLE);}}; ws.onerror=()=>{addMessage('Connection error','ai'); setState(State.IDLE);}; ws.onclose=()=>{if(current!==State.IDLE)setState(State.IDLE);}; setTimeout(()=>{if(current===State.LISTENING)setState(State.PROCESSING);},15000);};

    let clock=new THREE.Clock();
    function animate(){
        requestAnimationFrame(animate); const t=performance.now()*0.001;
        reactiveRing.rotation.z+=0.005; outerRing.rotation.x+=0.003; outerRing.rotation.y+=0.002; particles.rotation.y+=0.0005;
        if(current===State.IDLE){const s=1+Math.sin(t*2)*0.02; core.scale.set(s,s,s); shell.scale.set(s,s,s); core.material.emissiveIntensity=0.6+Math.sin(t*3)*0.2; reactiveRing.material.opacity=0.8; reactiveRing.scale.set(1,1,1);}
        else if(current===State.LISTENING){const tt=t*10; reactiveRing.scale.set(1+Math.sin(tt)*0.1,1+Math.cos(tt*1.3)*0.1,1); reactiveRing.material.opacity=1; reactiveRing.material.emissiveIntensity=1.5; core.scale.set(1+Math.sin(tt*2)*0.05,1+Math.cos(tt*1.8)*0.05,1); core.material.emissiveIntensity=1.8;}
        else if(current===State.PROCESSING){reactiveRing.material.emissiveIntensity=0.8; reactiveRing.scale.set(1,1,1); core.material.emissiveIntensity=0.8;}
        else if(current===State.SPEAKING){const s=1+Math.sin(t*8)*0.03; core.scale.set(s,s,s); shell.scale.set(s,s,s); reactiveRing.material.opacity=0.6; core.material.emissiveIntensity=1.2;}
        composer.render();
    }
    animate();
    window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
